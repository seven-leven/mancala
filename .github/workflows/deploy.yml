name: Check & deploy

# Every push and PR is checked. Only main deploys, and only if the check passes.
# gh-pages is a build artifact of main: never commit to it directly. Each deploy builds
# public/ and src/ into dist/ and publishes it to gh-pages as a fresh orphan commit.
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node (with npm's cache)
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Formatting
        run: npm run fmt:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run check

      - name: Tests (rules, bots, harness, docs)
        run: npm test

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to GitHub Pages
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node (with npm's cache)
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish dist/ to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
