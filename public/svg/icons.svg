<svg xmlns="http://www.w3.org/2000/svg">
  <!--
    The site's icons, one per <symbol>, used as <svg class="icon"><use href="svg/icons.svg#name"/></svg>
    (src/ui/icons.ts makes them from scripts). docs/DESIGN.md, "Icons", has the rules: outline only, a
    24 px grid, drawn with a 2 px line, round caps and joins, no fills; the page's .icon style sets
    the line, so these hold only the shapes. Keep this list in the order of docs/DESIGN.md's sheet.
  -->
  <symbol id="sun" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="4" />
    <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
  </symbol>
  <symbol id="moon" viewBox="0 0 24 24">
    <path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z" />
  </symbol>
  <symbol id="stats" viewBox="0 0 24 24">
    <path d="M4 20V10M10 20V4M16 20v-7M22 20H2" />
  </symbol>
  <symbol id="settings" viewBox="0 0 24 24">
    <path d="M4 7h10M18 7h2M4 17h4M12 17h8" />
    <circle cx="16" cy="7" r="2" />
    <circle cx="10" cy="17" r="2" />
  </symbol>
  <symbol id="help" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="9" />
    <path d="M9.6 9.2a2.5 2.5 0 0 1 4.8.8c0 1.7-2.4 2.2-2.4 3.7M12 17h.01" />
  </symbol>
  <symbol id="close" viewBox="0 0 24 24">
    <path d="M6 6l12 12M18 6L6 18" />
  </symbol>
  <symbol id="chevron-down" viewBox="0 0 24 24">
    <path d="M6 9l6 6 6-6" />
  </symbol>
  <symbol id="arrow-right" viewBox="0 0 24 24">
    <path d="M5 12h14M13 6l6 6-6 6" />
  </symbol>
  <symbol id="undo" viewBox="0 0 24 24">
    <path d="M9 14L4 9l5-5M4 9h10.5a5.5 5.5 0 0 1 0 11H11" />
  </symbol>
  <symbol id="skip" viewBox="0 0 24 24">
    <path d="M6 5l10 7-10 7zM19 5v14" />
  </symbol>
  <symbol id="replay" viewBox="0 0 24 24">
    <path d="M12 8v4l2.5 2.5M3.1 11a9 9 0 1 1 .5 4M3 20v-5h5" />
  </symbol>
  <symbol id="relay" viewBox="0 0 24 24">
    <path d="M20 11a8 8 0 0 0-15.4-2M4 5v4h4M4 13a8 8 0 0 0 15.4 2M20 19v-4h-4" />
  </symbol>
  <symbol id="free-turn" viewBox="0 0 24 24">
    <path d="M19.9 13a8 8 0 1 1-1.9-6.7M20 4v5h-5" />
  </symbol>
  <symbol id="capture" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="9" />
    <circle cx="12" cy="12" r="5" />
    <path d="M12 12h.01" />
  </symbol>
  <symbol id="tip" viewBox="0 0 24 24">
    <path d="M9 16a5 5 0 1 1 6 0 3.5 3.5 0 0 0-1 3 2 2 0 0 1-4 0 3.5 3.5 0 0 0-1-3M9.7 17h4.6" />
