<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 404" width="720" height="404" role="img" aria-labelledby="t d">
  <title id="t">Reading a rating</title>
  <desc
    id="d">Left: three ways two ratings can sit. Separate: Lookahead 1729 to 1776 and Planner 1680 to 1720 do not overlap. Too close to call: Chainer 1475 to 1515 and Spoiler 1459 to 1495 overlap. Noise: Spoiler moved from 1447 to 1476, inside its old range of 1414 to 1481. Right: how much a game tells you against the Elo gap between the bots: 100% at no gap, 73% at 200, 33% at 400, 7% at 700. Place a new bot within about 200 Elo of a neighbour.</desc>
  <style>
  svg {
    --ink: #161514;
    --muted: #6b6760;
    --rule: #dfdad0;
    --accent: #a8483f;
    --bg: #f6f4ef;
    --tint: #efe2dc;
  }
  @media (prefers-color-scheme: dark) {
    svg {
      --ink: #f6f4ef;
      --muted: rgba(246,244,239,0.62);
      --rule: rgba(246,244,239,0.14);
      --accent: #e39a86;
      --bg: #161514;
      --tint: rgba(227,154,134,0.14);
    }
  }
  text {
    font: 12px Inter, system-ui, sans-serif;
    fill: var(--ink);
  }
  .muted {
    fill: var(--muted);
  }
  .title {
    font: 400 20px "Instrument Serif", Georgia, serif;
  }
  .h {
    font-size: 14px;
    font-weight: 600;
  }
  .mono {
    font: 11.5px "IBM Plex Mono", ui-monospace, Consolas, monospace;
  }
  .small {
    font-size: 11px;
  }
  .num {
    font: 600 13px Inter, system-ui, sans-serif;
    fill: var(--bg);
  }
  .accent {
    fill: var(--accent);
  }
  .bg {
    fill: var(--bg);
  }
  .rule {
    stroke: var(--rule);
    fill: none;
  }
  .box {
    stroke: var(--rule);
    fill: none;
  }
  .dot {
    fill: var(--ink);
  }
  .bar {
    stroke: var(--ink);
    stroke-width: 4;
    stroke-linecap: round;
  }
  .bar.close {
    stroke: var(--accent);
  }
  .bar.old {
    stroke: var(--muted);
    stroke-width: 2;
  }
  .dot.close {
    fill: var(--accent);
  }
  .circle {
    fill: var(--ink);
  }
  .tint {
    fill: var(--tint);
  }
  .curve {
    stroke: var(--ink);
    stroke-width: 2;
    fill: none;
  }
  .mark {
    fill: var(--accent);
  }
  </style>
  <rect class="bg" width="720" height="404" rx="12" />
  <text class="title" x="24" y="34">Reading a rating</text>
  <text class="h" x="24" y="70">Separate</text>
  <text class="muted small" x="24" y="87">The ranges don't touch: the order is real.</text>
  <line class="bar " x1="193.9" x2="298.8" y1="108" y2="108" />
  <circle class="dot " cx="240.8" cy="108" r="4.5" />
  <text class="small" x="340" y="112">Lookahead · 1729–1776</text>
  <line class="bar " x1="84.6" x2="173.8" y1="130" y2="130" />
  <circle class="dot " cx="124.8" cy="130" r="4.5" />
  <text class="small" x="340" y="134">Planner · 1680–1720</text>
  <text class="h" x="24" y="166">Too close to call</text>
  <text class="muted small" x="24" y="183">The ranges overlap: either could be stronger.</text>
  <line class="bar close" x1="136.7" x2="291.3" y1="204" y2="204" />
  <circle class="dot close" cx="210.1" cy="204" r="4.5" />
  <text class="small" x="340" y="208">Chainer · 1475–1515</text>
  <line class="bar close" x1="74.8" x2="214.0" y1="226" y2="226" />
  <circle class="dot close" cx="140.5" cy="226" r="4.5" />
  <text class="small" x="340" y="230">Spoiler · 1459–1495</text>
  <text class="h" x="24" y="262">Noise, not a change</text>
  <text class="muted small" x="24" y="279">The new rating sits inside the old range.</text>
  <line class="bar old" x1="80.6" x2="274.9" y1="300" y2="300" />
  <circle class="dot " cx="176.3" cy="300" r="4.5" />
  <text class="small" x="340" y="304">Spoiler · 60 games</text>
  <line class="bar " x1="211.1" x2="315.5" y1="322" y2="322" />
  <circle class="dot " cx="260.4" cy="322" r="4.5" />
  <text class="small" x="340" y="326">Spoiler · 240 games</text>
  <text class="h" x="478" y="70">Close games tell you most</text>
  <text class="muted small" x="478" y="87">What a game is worth, by the Elo gap</text>
  <rect class="tint" x="530.0" y="96" width="40.0" height="204" />
  <line class="rule" x1="530" x2="690" y1="300.0" y2="300.0" />
  <text class="muted small" x="522" y="304" text-anchor="end">0%</text>
  <line class="rule" x1="530" x2="690" y1="198.0" y2="198.0" />
  <text class="muted small" x="522" y="202.0" text-anchor="end">50%</text>
  <line class="rule" x1="530" x2="690" y1="96.0" y2="96.0" />
  <text class="muted small" x="522" y="100" text-anchor="end">100%</text>
  <text class="muted small" x="530.0" y="316" text-anchor="middle">0</text>
  <text class="muted small" x="570.0" y="316" text-anchor="middle">200</text>
  <text class="muted small" x="610.0" y="316" text-anchor="middle">400</text>
  <text class="muted small" x="690.0" y="316" text-anchor="middle">800</text>
  <text class="muted small" x="610.0" y="332" text-anchor="middle">Elo gap between the two bots</text>
  <polyline class="curve"
    points="530.0,96.0 532.0,96.2 534.0,96.7 536.0,97.5 538.0,98.7 540.0,100.2 542.0,102.0 544.0,104.1 546.0,106.4 548.0,109.1 550.0,112.0 552.0,115.2 554.0,118.5 556.0,122.1 558.0,125.8 560.0,129.8 562.0,133.8 564.0,138.0 566.0,142.3 568.0,146.6 570.0,151.1 572.0,155.5 574.0,160.0 576.0,164.6 578.0,169.1 580.0,173.6 582.0,178.0 584.0,182.5 586.0,186.8 588.0,191.2 590.0,195.4 592.0,199.6 594.0,203.6 596.0,207.6 598.0,211.5 600.0,215.3 602.0,219.0 604.0,222.5 606.0,226.0 608.0,229.3 610.0,232.6 612.0,235.7 614.0,238.7 616.0,241.6 618.0,244.4 620.0,247.0 622.0,249.6 624.0,252.1 626.0,254.4 628.0,256.7 630.0,258.9 632.0,260.9 634.0,262.9 636.0,264.8 638.0,266.6 640.0,268.3 642.0,270.0 644.0,271.5 646.0,273.0 648.0,274.4 650.0,275.8 652.0,277.0 654.0,278.2 656.0,279.4 658.0,280.5 660.0,281.5 662.0,282.5 664.0,283.5 666.0,284.3 668.0,285.2 670.0,286.0 672.0,286.7 674.0,287.5 676.0,288.1 678.0,288.8 680.0,289.4 682.0,290.0 684.0,290.5 686.0,291.0 688.0,291.5 690.0,292.0" />
  <circle class="mark" cx="570.0" cy="151.1" r="4" />
  <text class="small" x="576.0" y="143.05426817689664">73%</text>
  <circle class="mark" cx="610.0" cy="232.6" r="4" />
  <text class="small" x="616.0" y="224.56198347107437">33%</text>
  <circle class="mark" cx="670.0" cy="286.0" r="4" />
  <text class="small" x="676.0" y="277.9918769088783">7%</text>
  <text class="accent small" x="550.0" y="292" text-anchor="middle">place</text>
  <text class="accent small" x="550.0" y="278" text-anchor="middle">aim to</text>
  <text class="muted small" x="478" y="356">A new bot earns its place within</text>
  <text class="muted small" x="478" y="371">about 200 Elo of a neighbour, in a</text>
  <text class="muted small" x="478" y="386">gap wider than that.</text>
</svg>
