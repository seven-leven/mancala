<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 572" width="720" height="572" role="img"
  aria-labelledby="t d">
  <title id="t">The bots' Elo ladder</title>
  <desc
    id="d">Minimax 1974 (1939–2014), DFS 1898 (1859–1941), Shrewd 1845 (1813–1883), Lookahead 1689 (1656–1730), Planner 1669 (1633–1705), Chainer 1470 (1436–1509), Spoiler 1447 (1414–1481), Greedy 1319 (1286–1351), Turtle 1303 (1276–1334), Sometimes greedy 1211 (1182–1243), Striker 1154 (1124–1187), First 1012 (982–1042), Random 1000 (1000–1000), Hoarder 951 (914–983), Sometimes generous 776 (740–819), Generous 638 (600–678), Pushover 566 (520–599)</desc>
  <style>
  svg {
    --ink: #161514;
    --muted: #6b6760;
    --rule: #dfdad0;
    --accent: #a8483f;
    --bg: #f6f4ef;
  }
  @media (prefers-color-scheme: dark) {
    svg {
      --ink: #f6f4ef;
      --muted: rgba(246,244,239,0.62);
      --rule: rgba(246,244,239,0.14);
      --accent: #e39a86;
      --bg: #161514;
    }
  }
  text {
    font: 12px Inter, system-ui, sans-serif;
    fill: var(--ink);
  }
  .muted,
  .tick,
  .note {
    fill: var(--muted);
  }
  .tick,
  .note {
    font-size: 11px;
  }
  .title {
    font: 400 20px "Instrument Serif", Georgia, serif;
  }
  .grid {
    stroke: var(--rule);
  }
  .mark {
    stroke: var(--muted);
    stroke-width: 2;
    stroke-linecap: round;
  }
  .mark.overlap {
    stroke: var(--accent);
  }
  .dot {
    fill: var(--ink);
    stroke: var(--bg);
    stroke-width: 2;
  }
  .dot.overlap {
    fill: var(--accent);
  }
  .bg {
    fill: var(--bg);
  }
  .accent {
    fill: var(--accent);
  }
  </style>
