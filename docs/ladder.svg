<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 572" width="720" height="572" role="img"
  aria-labelledby="t d">
  <title id="t">The bots' Elo ladder</title>
  <desc
    id="d">Minimax 2064 (2043–2092), DFS 1976 (1957–2004), Shrewd 1905 (1884–1931), Lookahead 1750 (1729–1776), Planner 1698 (1680–1720), Chainer 1494 (1475–1515), Spoiler 1476 (1459–1495), Greedy 1325 (1310–1344), Turtle 1315 (1299–1336), Sometimes greedy 1205 (1188–1225), Striker 1147 (1130–1165), Random 1000 (1000–1000), First 999 (984–1017), Hoarder 920 (905–940), Sometimes generous 730 (709–752), Generous 561 (537–586), Pushover 494 (471–518)</desc>
  <style>
  svg {
    --ink: #161514;
    --muted: #6b6760;
    --rule: #dfdad0;
    --accent: #a8483f;
    --bg: #f6f4ef;
  }
  @media (prefers-color-scheme: dark) {
    svg {
      --ink: #f6f4ef;
      --muted: rgba(246,244,239,0.62);
      --rule: rgba(246,244,239,0.14);
      --accent: #e39a86;
      --bg: #161514;
    }
  }
  text {
    font: 12px Inter, system-ui, sans-serif;
    fill: var(--ink);
  }
  .muted,
  .tick,
  .note {
    fill: var(--muted);
  }
  .tick,
  .note {
    font-size: 11px;
  }
  .title {
    font: 400 20px "Instrument Serif", Georgia, serif;
  }
  .grid {
    stroke: var(--rule);
  }
  .mark {
    stroke: var(--muted);
    stroke-width: 2;
    stroke-linecap: round;
  }
  .mark.overlap {
    stroke: var(--accent);
  }
  .dot {
    fill: var(--ink);
    stroke: var(--bg);
    stroke-width: 2;
  }
  .dot.overlap {
    fill: var(--accent);
  }
  .bg {
    fill: var(--bg);
  }
  .accent {
    fill: var(--accent);
  }
  </style>
