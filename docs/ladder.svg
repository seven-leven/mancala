<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 544" width="720" height="544" role="img"
  aria-labelledby="t d">
  <title id="t">The bots' Elo ladder</title>
  <desc
    id="d">Minimax 2043 (2020–2070), DFS 1980 (1955–2008), Shrewd 1908 (1885–1935), Lookahead 1739 (1720–1768), Planner 1685 (1667–1712), Chainer 1477 (1459–1502), Spoiler 1466 (1448–1488), Greedy 1320 (1303–1340), Turtle 1307 (1290–1329), Sometimes greedy 1183 (1165–1204), Striker 1152 (1134–1172), Random 1000 (1000–1000), Hoarder 943 (922–967), Sometimes generous 757 (738–778), Generous 585 (561–610), Pushover 516 (491–543)</desc>
  <style>
  svg {
    --ink: #161514;
    --muted: #6b6760;
    --rule: #dfdad0;
    --accent: #a8483f;
    --bg: #f6f4ef;
  }
  @media (prefers-color-scheme: dark) {
    svg {
      --ink: #f6f4ef;
      --muted: rgba(246,244,239,0.62);
      --rule: rgba(246,244,239,0.14);
      --accent: #e39a86;
      --bg: #161514;
    }
  }
  text {
    font: 12px Inter, system-ui, sans-serif;
    fill: var(--ink);
  }
  .muted,
  .tick,
  .note {
    fill: var(--muted);
  }
  .tick,
  .note {
    font-size: 11px;
  }
  .title {
    font: 400 20px "Instrument Serif", Georgia, serif;
  }
  .grid {
    stroke: var(--rule);
  }
  .mark {
    stroke: var(--muted);
    stroke-width: 2;
    stroke-linecap: round;
  }
  .mark.overlap {
    stroke: var(--accent);
  }
  .dot {
    fill: var(--ink);
    stroke: var(--bg);
    stroke-width: 2;
  }
  .dot.overlap {
    fill: var(--accent);
  }
  .bg {
    fill: var(--bg);
  }
  .accent {
    fill: var(--accent);
  }
  </style>
