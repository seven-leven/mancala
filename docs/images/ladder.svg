  <title id="t">The bots' Elo ladder</title>
  <desc id="d">Minimax 2068 (2050–2091), Learned DFS 2058 (2036–2082), DFS v2 2041 (2021–2064), DFS 2007 (1987–2031), Shrewd 1925 (1907–1948), Monte Carlo 1857 (1837–1878), Lookahead 1742 (1723–1764), Planner 1670 (1652–1692), Sometimes planner 1556 (1539–1578), Chainer 1492 (1477–1512), Spoiler 1468 (1450–1487), Greedy 1324 (1307–1342), Turtle 1285 (1268–1303), Sometimes greedy 1185 (1169–1203), Striker 1163 (1144–1182), Random 1000 (1000–1000), Hoarder 909 (888–925), Fickle 804 (785–825), Sometimes generous 731 (711–749), Generous 567 (546–588), Pushover 489 (469–511), Decompiled pushover 480 (460–501), Learned pushover 456 (434–476)</desc>
  <style>svg { --ink: #161514; --muted: #6b6760; --rule: #dfdad0; --accent: #a8483f; --bg: #f6f4ef; }
  @media (prefers-color-scheme: dark) {
    svg { --ink: #f6f4ef; --muted: rgba(246,244,239,0.62); --rule: rgba(246,244,239,0.14); --accent: #e39a86; --bg: #161514; }
  }
  text { font: 12px Inter, system-ui, sans-serif; fill: var(--ink); }
  .muted, .tick, .note { fill: var(--muted); }
  .tick, .note { font-size: 11px; }
  .title { font: 400 20px "Instrument Serif", Georgia, serif; }
  .grid { stroke: var(--rule); }
  .mark { stroke: var(--muted); stroke-width: 2; stroke-linecap: round; }
  .mark.overlap { stroke: var(--accent); }
  .dot { fill: var(--ink); stroke: var(--bg); stroke-width: 2; }
  .dot.overlap { fill: var(--accent); }
  .bg { fill: var(--bg); }
  .accent { fill: var(--accent); }</style>
