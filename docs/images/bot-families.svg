  <text class="muted small" x="38" y="1209">Longest or shortest game</text>
  <rect class="card" x="284" y="1115" width="248" height="112" rx="8" />
  <text class="h" x="298" y="1139">Rule variants</text>
  <text class="muted small" x="298" y="1161">Every bot is tuned for 7 seeds</text>
  <text class="muted small" x="298" y="1177">Bots for the house rules (3–15</text>
  <text class="muted small" x="298" y="1193">seeds, captures either side)</text>
  <text class="muted small" x="298" y="1209">And for the pie rule (#17)</text>
  <rect class="card" x="544" y="1115" width="248" height="112" rx="8" />
  <text class="h" x="558" y="1139">Novelty</text>
  <text class="muted small" x="558" y="1161">An LLM bot: Claude plays</text>
  <text class="muted small" x="558" y="1177">through the API</text>
  <text class="muted small" x="558" y="1193">Slow and needs a key,</text>
  <text class="muted small" x="558" y="1209">but a fun rung to rate</text>
  <text class="h" x="808" y="1139">A ceiling to remember</text>
  <text class="muted small" x="808" y="1161">From these openings the seat decides</text>
