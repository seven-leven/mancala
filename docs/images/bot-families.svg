  <text class="label" x="24" y="979">BEYOND THE GRID: NEW AXES NOBODY HAS TRIED YET</text>
  <rect class="card" x="24" y="991" width="248" height="112" rx="8" />
  <text class="h" x="38" y="1015">Learning without a teacher</text>
  <text class="muted small" x="38" y="1037">Self-play / TD learning: the only</text>
  <text class="muted small" x="38" y="1053">way past Minimax's own labels</text>
