  <text class="muted small" x="818" y="1053">faces, and plays to its weaknesses</text>
  <text class="muted small" x="818" y="1069">Mirror: copies your pit</text>
  <text class="muted small" x="818" y="1085">Ensemble: a vote of several bots</text>
  <rect class="card" x="24" y="1115" width="248" height="112" rx="8" />
  <text class="h" x="38" y="1139">Style</text>
