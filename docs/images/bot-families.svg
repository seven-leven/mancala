<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1076 1251"
  width="1076"
  height="1251"
  role="img"
  aria-labelledby="t d"
>
  <title id="t">The bots, by family, and the gaps between them</title>
  <desc id="d">A grid of the bots: rows are how a bot decides (no look-ahead, one move ahead, chains of free turns, fixed-depth search, search to lose, sampling a game tree, mixes) and columns are what it judges positions by (nothing, a hand-written score, a learned net, a decompiled formula, random playouts). Each filled cell lists its bots with their Elo; dashed cells are untried combinations such as Net minimax, Decompiled DFS, net-guided MCTS and a strength dial. Below, new axes: learning without a teacher, exact play, strength for people, reading the opponent, style, rule variants and an LLM bot.</desc>
  <style>svg { --ink: #161514; --muted: #6b6760; --rule: #dfdad0; --strong: #cbc4b6; --accent: #a8483f; --bg: #f6f4ef; --surface: #fffdf9; --tint: #f3e6e1; }
  @media (prefers-color-scheme: dark) {
    svg { --ink: #f6f4ef; --muted: rgba(246,244,239,0.62); --rule: rgba(246,244,239,0.14); --strong: rgba(246,244,239,0.3); --accent: #e39a86; --bg: #161514; --surface: #1f1d1b; --tint: rgba(227,154,134,0.12); }
  }
  text { font: 12px Inter, system-ui, sans-serif; fill: var(--ink); }
  .title { font: 400 26px "Instrument Serif", Georgia, serif; }
  .label { font-size: 10.5px; font-weight: 600; letter-spacing: 1.4px; fill: var(--muted); }
  .h { font-size: 13px; font-weight: 600; }
  .muted { fill: var(--muted); }
  .small { font-size: 11px; }
  .mono { font: 11px "IBM Plex Mono", ui-monospace, Consolas, monospace; fill: var(--muted); }
  .accent { fill: var(--accent); }
  .page { fill: var(--bg); }
  .tint { fill: var(--tint); }
  .box { fill: var(--surface); stroke: var(--strong); stroke-width: 1; }
  .box.key { stroke: var(--accent); stroke-width: 1.5; }
  .arrow { stroke: var(--muted); stroke-width: 1.5; fill: none; marker-end: url(#a); }
  .arrow.key { stroke: var(--accent); marker-end: url(#ak); }
  .tip { fill: var(--muted); }
  .tip.key { fill: var(--accent); }
  .mono { font: 11px "IBM Plex Mono", ui-monospace, Consolas, monospace; fill: var(--muted); }
  .gaptext { font-size: 11px; fill: var(--accent); }
  .gaptext.b { font-weight: 600; }
  .cell { fill: var(--surface); stroke: var(--rule); stroke-width: 1; }
  .head { fill: var(--tint); }
  .gap { fill: none; stroke: var(--accent); stroke-width: 1.2; stroke-dasharray: 4 3; }
  .gap.free { fill: var(--tint); stroke-dasharray: none; }
  .card { fill: var(--surface); stroke: var(--strong); stroke-width: 1; }</style>
  <rect class="page" width="1076" height="1251" />
  <text class="title" x="24" y="52">The bots, by family</text>
  <text
    class="muted small"
    x="24"
    y="74"
  >Rows: how a bot decides. Columns: what it judges positions by. Elo from the 240-game rating, Random pinned at 1000.</text>
  <text
    class="muted small"
    x="24"
    y="90"
  >Dashed: a gap worth trying. Filled: the gaps that are cheapest (Decompiled DFS, the strength dial) or most promising (net-guided MCTS).</text>
