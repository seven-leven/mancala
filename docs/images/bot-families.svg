  <text class="label" x="24" y="961">BEYOND THE GRID: NEW AXES NOBODY HAS TRIED YET</text>
  <rect class="card" x="24.0" y="973" width="248.0" height="112" rx="8" />
  <text class="h" x="38.0" y="997">Learning without a teacher</text>
  <text class="muted small" x="38.0" y="1019">Self-play / TD learning: the only</text>
  <text class="muted small" x="38.0" y="1035">way past Minimax's own labels</text>
  <text class="muted small" x="38.0" y="1051">Evolved weights for evaluate()</text>
  <text class="muted small" x="38.0" y="1067">Plays like you: trained on your games</text>
  <rect class="card" x="284.0" y="973" width="248.0" height="112" rx="8" />
  <text class="h" x="298.0" y="997">Exact play</text>
  <text class="muted small" x="298.0" y="1019">Endgame tablebase: solve every</text>
  <text class="muted small" x="298.0" y="1035">position with few seeds left</text>
  <text class="muted small" x="298.0" y="1051">Opening book (pit 1 wins by force)</text>
  <text class="muted small" x="298.0" y="1067">Proof-number search</text>
  <rect class="card" x="544.0" y="973" width="248.0" height="112" rx="8" />
  <text class="h" x="558.0" y="997">Strength for people</text>
  <text class="muted small" x="558.0" y="1019">Rubber band: keeps the game close</text>
  <text class="muted small" x="558.0" y="1035">Sandbagger: weak until it's behind</text>
  <text class="muted small" x="558.0" y="1051">Teacher: points out your mistakes</text>
  <text class="muted small" x="558.0" y="1067">Fills the gaps at 567–731, 1324–1468</text>
  <rect class="card" x="804.0" y="973" width="248.0" height="112" rx="8" />
  <text class="h" x="818.0" y="997">Reading the opponent</text>
  <text class="muted small" x="818.0" y="1019">Exploiter: works out which bot it</text>
  <text class="muted small" x="818.0" y="1035">faces, and plays to its weaknesses</text>
  <text class="muted small" x="818.0" y="1051">Mirror: copies your pit</text>
  <text class="muted small" x="818.0" y="1067">Ensemble: a vote of several bots</text>
  <rect class="card" x="24.0" y="1097" width="248.0" height="112" rx="8" />
