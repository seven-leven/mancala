  <text class="muted small" x="298" y="1037">Endgame tablebase: solve every</text>
  <text class="muted small" x="298" y="1053">position with few seeds left</text>
  <text class="muted small" x="298" y="1069">Opening book (pit 1 wins by force)</text>
  <text class="muted small" x="298" y="1085">Proof-number search</text>
  <rect class="card" x="544" y="991" width="248" height="112" rx="8" />
  <text class="h" x="558" y="1015">Strength for people</text>
  <text class="muted small" x="558" y="1037">Rubber band: keeps the game close</text>
  <text class="muted small" x="558" y="1053">Sandbagger: weak until it's behind</text>
  <text class="muted small" x="558" y="1069">Teacher: points out your mistakes</text>
  <text class="muted small" x="558" y="1085">Fills the gaps at 567–731, 1324–1468</text>
  <rect class="card" x="804" y="991" width="248" height="112" rx="8" />
  <text class="h" x="818" y="1015">Reading the opponent</text>
