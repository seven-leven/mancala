  <text class="muted small" x="38.0" y="1191">Longest or shortest game</text>
  <rect class="card" x="284.0" y="1097" width="248.0" height="112" rx="8" />
  <text class="h" x="298.0" y="1121">Rule variants</text>
  <text class="muted small" x="298.0" y="1143">Every bot is tuned for 7 seeds</text>
  <text class="muted small" x="298.0" y="1159">Bots for the house rules (3–15</text>
  <text class="muted small" x="298.0" y="1175">seeds, captures either side)</text>
  <text class="muted small" x="298.0" y="1191">And for the pie rule (#17)</text>
  <rect class="card" x="544.0" y="1097" width="248.0" height="112" rx="8" />
  <text class="h" x="558.0" y="1121">Novelty</text>
  <text class="muted small" x="558.0" y="1143">An LLM bot: Claude plays</text>
  <text class="muted small" x="558.0" y="1159">through the API</text>
  <text class="muted small" x="558.0" y="1175">Slow and needs a key,</text>
