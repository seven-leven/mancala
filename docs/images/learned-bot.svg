<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 760" width="720" height="760" role="img" aria-labelledby="t d">
  <title id="t">The learned bot: how it is trained and how it plays</title>
  <desc id="d">Training, offline: varied games give 200,000 positions, Minimax labels each one at depth 6, and a small value network is trained to match the labels; its 561 weights are committed. Play, every move: from the position, DFS v2's chain search follows the bot's own chains and the opponent's best answer, the value network scores each position at the end of a line, and the best move is played. The network takes 16 numbers (the pits and stores, from the mover's side), has two hidden layers of 16, and gives one value. It ties Minimax at about a third of its time, and could improve by self-play under the pie rule.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="tip" d="M0 0L10 5L0 10z" />
    </marker>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="tip key" d="M0 0L10 5L0 10z" />
    </marker>
  </defs>
