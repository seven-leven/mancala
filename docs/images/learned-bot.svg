  <text class="title" x="24" y="36">A learned bot</text>
  <text class="muted small" x="696" y="36" text-anchor="end">built October 2026 · in the menus as Wise</text>
  <text class="label" x="24" y="80">TRAINING · OFFLINE, ONCE</text>
  <rect class="box" x="24" y="92" width="156" height="78" rx="8" />
  <text class="h" x="36" y="114">Varied games</text>
  <text class="muted small" x="36" y="132">DFS v2, with some</text>
