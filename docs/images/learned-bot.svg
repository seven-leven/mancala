  <text class="muted small" x="552" y="147">seeded, a minute</text>
  <rect class="box key" x="540" y="196" width="156" height="58" rx="8" />
  <text class="h" x="552" y="218">weights.ts</text>
  <text class="muted small" x="552" y="236">561 weights</text>
  <line class="arrow key" x1="618" y1="172" x2="618" y2="193" />
  <text class="label" x="24" y="292">PLAY · IN THE BOT, EVERY MOVE</text>
  <rect class="box" x="24" y="304" width="156" height="78" rx="8" />
  <text class="h" x="36" y="326">The position</text>
  <text class="muted small" x="36" y="344">pits, stores and</text>
  <text class="muted small" x="36" y="359">whose turn it is</text>
  <line class="arrow" x1="182" y1="343" x2="193" y2="343" />
  <rect class="box" x="196" y="304" width="156" height="78" rx="8" />
  <text class="h" x="208" y="326">Chain search</text>
  <text class="muted small" x="208" y="344">DFS v2: its chains,</text>
  <text class="muted small" x="208" y="359">then your best answer</text>
  <line class="arrow" x1="354" y1="343" x2="365" y2="343" />
  <rect class="box key" x="368" y="304" width="156" height="78" rx="8" />
  <text class="h" x="380" y="326">Value net</text>
  <text class="muted small" x="380" y="344">scores the end of</text>
  <text class="muted small" x="380" y="359">each line, in µs</text>
  <line class="arrow" x1="526" y1="343" x2="537" y2="343" />
  <rect class="box" x="540" y="304" width="156" height="78" rx="8" />
  <text class="h" x="552" y="326">The move</text>
  <text class="muted small" x="552" y="344">the line whose worst</text>
  <text class="muted small" x="552" y="359">answer scores best</text>
  <path class="arrow key" d="M618 256 V278 H446 V301" />
  <text class="accent small" x="456" y="274">loaded once</text>
  <text
    class="muted small"
    x="24"
    y="404"
  >Search handles the tactics (chains, captures); the net handles judgement: it calls the winner right 91% of the time.</text>
